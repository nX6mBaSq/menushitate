<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P28 パートナー問い合わせ｜デザイン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=Shippori+Mincho+B1:wght@600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../assets/style.css">
</head>
<body data-id="P28" data-url="/partner/contact/" data-pub="Phase 2〜"
  data-role="パートナー企業専用のお問い合わせフォーム"
  data-cta="フォーム送信">
<div class="site">
<div data-wf="header"></div>
<main>
  <div data-wf="hero" data-en="PARTNER CONTACT" data-title="パートナー問い合わせ" data-lead="提携に関するお問い合わせはこちらからお願いします。"></div>
  <section class="sec">
    <span class="sec-label">SEC-01 フォーム</span>
    <div class="inner narrow">
      <ol class="prog"><li class="on">1. 入力</li><li>2. 確認</li><li>3. 完了</li></ol>
      <div class="form-box form">
        <div class="field"><span class="lbl">会社名<span class="req">必須</span></span><div class="input"></div></div>
        <div class="grid g2">
          <div class="field"><span class="lbl">部署名<span class="opt">任意</span></span><div class="input"></div></div>
          <div class="field"><span class="lbl">ご担当者名<span class="req">必須</span></span><div class="input"></div></div>
        </div>
        <div class="grid g2">
          <div class="field"><span class="lbl">メールアドレス<span class="req">必須</span></span><div class="input"></div></div>
          <div class="field"><span class="lbl">電話番号<span class="req">必須</span></span><div class="input"></div></div>
        </div>
        <div class="field"><span class="lbl">業種<span class="req">必須</span></span><div class="choices"><span>クラウドPOS</span><span>モバイルオーダー</span><span>厨房機器</span><span>店舗仲介</span><span>営業代行</span><span>その他</span></div></div>
        <div class="field"><span class="lbl">お取引のある飲食店の数<span class="req">必須</span></span><div class="input sel">〜50店舗／50〜200店舗／200〜1,000店舗／1,000店舗以上</div></div>
        <div class="field"><span class="lbl">希望する提携の形<span class="opt">任意</span></span><div class="choices cb"><span>店舗の紹介</span><span>共同での提案</span><span>自社サービスへの組み込み</span><span>まずは情報交換</span></div></div>
        <div class="field"><span class="lbl">お問い合わせ内容<span class="opt">任意</span></span><div class="input ta"></div></div>
        <div class="field"><div class="choices cb"><span><a data-to="P30">プライバシーポリシー</a>に同意する</span></div></div>
        <button class="btn cv lg block" type="button">入力内容を確認する</button>
      </div>
      <div class="note">確認・完了画面は P25・P26 と同じ構成（文言だけパートナー向けに変更）。</div>
    </div>
  </section>
</main>
<div data-wf="footer"></div>
</div>
<script src="../assets/site.js" data-root="../"></script>
</body>
</html>
